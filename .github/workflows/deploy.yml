name: Fast CI & Auto-Deploy to DCISM Server

on:
  push:
    branches:
      - main
      - Modernize

jobs:
  build-and-deploy:
    name: Build Check & Server Auto-Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ⚡ Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: 📦 Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔧 Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://s21100713_lost_n_found:Kennethoy1@web.dcism.org:3306/s21100713_lost_n_found"

      - name: 🔨 Verify Production Build
        run: npm run build
        env:
          DATABASE_URL: "mysql://s21100713_lost_n_found:Kennethoy1@web.dcism.org:3306/s21100713_lost_n_found"
          JWT_SECRET: "dcism_carolinian_lost_n_found_jwt_secret_key_2026"
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🚀 Trigger Server Auto-Deployment Webhook
        if: success()
        run: |
          echo "🚀 Sending deployment webhook trigger to lost-n-found.dcism.org..."
          
          PAYLOAD='{"ref":"${{ github.ref }}","repository":"${{ github.repository }}","pusher":{"name":"${{ github.actor }}"}}'
          SECRET="${{ secrets.GITHUB_WEBHOOK_SECRET }}"
          
          if [ -z "$SECRET" ]; then
            SECRET="dcism_carolinian_lost_n_found_jwt_secret_key_2026"
          fi
          
          # Compute HMAC SHA256 Signature
          SIG="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.*= //')"
          
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -H "X-Deployment-Secret: $SECRET" \
            -d "$PAYLOAD" \
            "https://lost-n-found.dcism.org/api/deploy" || true
